<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>零挽的FNF教程入口</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background: linear-gradient(135deg, #00aeec, #8bdcff);
        }

        .box {
            width: calc(100% - 40px);
            max-width: 420px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 24px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);
        }

        h1 {
            margin: 0 0 12px;

            font-size: 28px;
            color: #222;
        }

        p {
            margin: 0;

            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 15px;

            border: none;
            border-radius: 14px;

            background: #00aeec;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(0, 174, 236, 0.3);

            transition: transform 0.15s;
        }

        button:active {
            transform: scale(0.96);
        }

        #status {
            margin-top: 18px;

            min-height: 24px;

            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>哔哩哔哩</h1>

    <p>
        点击下面的按钮打开哔哩哔哩
    </p>

    <button onclick="openBilibili()">
        打开哔哩哔哩
    </button>

    <div id="status"></div>

</div>

<script>
    // 你的 Bilibili 链接
    const webUrl = "https://b23.tv/GPr4jzl";

    function openBilibili() {

        const status = document.getElementById("status");

        status.textContent = "正在尝试打开哔哩哔哩 App…";

        /*
         * 尝试使用 Bilibili Deep Link。
         *
         * 注意：
         * 不同版本的 Bilibili / Android / 浏览器
         * 对 Deep Link 的支持可能不同。
         */

        const appUrl = "bilibili://";

        // 记录开始时间
        const startTime = Date.now();

        // 尝试打开 App
        window.location.href = appUrl;

        /*
         * 如果 App 没有打开，
         * 浏览器通常仍然会留在当前页面。
         *
         * 约 1.5 秒后打开备用网页。
         */
        setTimeout(function () {

            // 如果页面仍然处于可见状态，
            // 就认为 App 没有成功接管页面。

            if (!document.hidden) {

                status.textContent =
                    "未检测到 App，正在打开网页…";

                window.location.href = webUrl;
            }

        }, 1500);
    }

    /*
     * 如果成功切换到了 App，
     * 浏览器页面通常会进入 hidden 状态。
     */
    document.addEventListener("visibilitychange", function () {

        if (document.hidden) {

            const status = document.getElementById("status");

            status.textContent =
                "正在打开哔哩哔哩…";
        }

    });
</script>

</body>
</html>
