<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#00AEEC">

    <title>零挽的FNF模组制作教程</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #00AEEC 0%,
                    #69D7FF 100%
                );
        }

        .card {
            width: 100%;
            max-width: 420px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.18);
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #00AEEC;

            color: white;

            font-size: 42px;
            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(0, 174, 236, 0.3);
        }

        h1 {
            margin: 0;

            font-size: 28px;
            color: #222;
        }

        .description {
            margin: 12px 0 0;

            color: #666;

            font-size: 15px;
            line-height: 1.7;
        }

        .open-button {
            width: 100%;

            margin-top: 28px;

            padding: 16px;

            border: 0;
            border-radius: 14px;

            background: #00AEEC;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(0, 174, 236, 0.3);

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        .open-button:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        .status {
            min-height: 22px;

            margin-top: 18px;

            color: #777;

            font-size: 14px;
        }

        .fallback-button {
            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 12px;

            background: white;
            color: #555;

            font-size: 15px;

            cursor: pointer;
        }

        .footer {
            margin-top: 25px;

            color: #aaa;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        B
    </div>

    <h1>哔哩哔哩</h1>

    <p class="description">
        点击下面的按钮<br>
        尝试使用哔哩哔哩 App 打开
    </p>

    <button
        class="open-button"
        id="openButton"
        onclick="openBilibili()">
        打开哔哩哔哩
    </button>

    <div
        class="status"
        id="status">
    </div>

    <button
        class="fallback-button"
        id="fallbackButton"
        onclick="openWeb()">
        使用网页打开
    </button>

    <div class="footer">
        Android · Bilibili
    </div>

</div>

<script>

    /*
     * ==============================
     * 基础设置
     * ==============================
     */

    // 你的 Bilibili 网页链接
    const WEB_URL =
        "https://b23.tv/GPr4jzl";

    // 中国大陆版哔哩哔哩 Android 包名
    const BILIBILI_PACKAGE =
        "tv.danmaku.bili";

    // Bilibili Scheme
    const BILIBILI_SCHEME =
        "bilibili";


    /*
     * ==============================
     * 页面元素
     * ==============================
     */

    const statusText =
        document.getElementById("status");

    const openButton =
        document.getElementById("openButton");

    const fallbackButton =
        document.getElementById("fallbackButton");


    /*
     * ==============================
     * 状态
     * ==============================
     */

    let tryingToOpenApp = false;

    let pageHidden = false;


    /*
     * ==============================
     * 打开网页
     * ==============================
     */

    function openWeb() {

        statusText.textContent =
            "正在打开网页…";

        window.location.href =
            WEB_URL;
    }


    /*
     * ==============================
     * 打开 Bilibili App
     * ==============================
     */

    function openBilibili() {

        tryingToOpenApp = true;

        pageHidden = false;

        statusText.textContent =
            "正在尝试打开哔哩哔哩 App…";

        openButton.disabled = true;

        openButton.style.opacity =
            "0.7";


        /*
         * Android Intent
         *
         * package：
         * tv.danmaku.bili
         *
         * fallback：
         * 如果系统无法打开 App，
         * 浏览器可以使用这个网页地址。
         */

        const intent =
            "intent://#Intent;" +

            "scheme=" +
            BILIBILI_SCHEME +
            ";" +

            "package=" +
            BILIBILI_PACKAGE +
            ";" +

            "S.browser_fallback_url=" +
            encodeURIComponent(WEB_URL) +

            ";" +

            "end";


        /*
         * 尝试启动 App
         */

        try {

            window.location.href =
                intent;

        } catch (error) {

            console.log(
                "Intent 启动失败：",
                error
            );

            openWeb();

            return;
        }


        /*
         * 等待 App 启动
         */

        setTimeout(function () {

            /*
             * 如果网页没有进入后台，
             * 说明大概率没有成功切换到 App。
             */

            if (!pageHidden) {

                statusText.textContent =
                    "没有成功打开 App";

                openButton.disabled =
                    false;

                openButton.style.opacity =
                    "1";

                fallbackButton.style.display =
                    "block";

            }

        }, 2200);
    }

    document.addEventListener(
        "visibilitychange",
        function () {

            if (document.hidden) {

                pageHidden = true;

                statusText.textContent =
                    "正在打开哔哩哔哩 App…";
            }

        }
    );


    /*
     * ==============================
     * 页面重新回到前台
     * ==============================
     */

    window.addEventListener(
        "pageshow",
        function () {

            if (tryingToOpenApp) {

                openButton.disabled =
                    false;

                openButton.style.opacity =
                    "1";
            }

        }
    );

</script>

</body>
</html>
